      - { key: dustlands-west, area: [ { min-x: 1180, min-z: -80, max-x: 1360, max-z: 80 } ] }

  safari-plains:
    world: world
    level-band: { min: 21, max: 30 }
    pvp: false
    area:
      - { min-x: 2500, min-z: -500, max-x: 3500, max-z: 500 }
