# B06 - experience and levels. Every balancing number lives here, never in code (Principle V).
#
# Vanilla XP and the vanilla experience bar are NOT used as progress storage. This block keeps its
# own numbers; whether the bar later mirrors them is B13's decision, not this file's.

# The curve. The key is the level being reached, the value the experience needed INSIDE the level
# below it. The highest key here IS the maximum level - it is deliberately not a constant in code,
# so raising the ceiling is one more line.
#
# Three rules are checked at startup, and a violation names the first offending level:
# no gaps from 2 upwards, every value positive, strictly increasing. A gap leaves a level
# unreachable, a zero makes it free, and a non-increasing sequence pins a player in place forever.
#
# Shape of this table: ~7.5 % per level, so 100 at level 2 and 6630 at level 60. That is 93,800
# experience in total, or roughly 7,800 kills of an ordinary mob - moderate, as decided for B06.
xp-curve:
  2: 100
  3: 110
  4: 120
  5: 130
  6: 140
  7: 150
  8: 160
  9: 170
  10: 180
  11: 190
  12: 210
