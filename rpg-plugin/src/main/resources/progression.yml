# What one level adds to each attribute. The keys are the attribute keys from stats.yml, so the two
# files name the same things the same way.
#
# EVERY field is required, including the three that are zero. A missing field stops the start rather
# than quietly becoming zero - otherwise "movement speed does not grow" would be indistinguishable
# from "somebody forgot the line".
#
# Why those three are zero:
#   movementSpeed   - Minecraft is extremely sensitive here; growth over 60 levels is unplayable.
#   attackSpeed     - runs into vanilla invulnerability (B05, ~2 hits/second); growth evaporates.
#   abilityCooldown - B08 already sells cooldown reduction for coins; two sources would compound.
#
# The two regeneration rates (ADR-023) grow here rather than on an equipment ladder: they are the
# one pair of attributes the operator asked to come from levelling alone, which is why LadderSlot
# still carries four attributes per ladder and no tier gained a value.
#
# Class-neutral. B07 replaces these numbers per class without a single code change.
level-growth:
  health: 8.0
  healthRegen: 0.5
  defense: 2.0
  mana: 4.0
  manaRegen: 0.2
  physicalDamage: 1.5
  magicDamage: 1.5
  attackSpeed: 0.0
  movementSpeed: 0.0
  abilityCooldown: 0.0

# Experience per mob type. Same shape as `mobs:` in combat.yml, so two files side by side read
# alike: a default plus overrides keyed by the Bukkit type name in upper case.
#
# A mob without an entry of its own gets the default and produces ONE warning per type - not per
# kill. Zero would mean every mob Mojang adds is silently worthless.
#
# Until B10 exists, this file is the truth about what a creature is worth.
mob-xp:
  default: 10
  by-type:
    ZOMBIE: 12
    HUSK: 13
    DROWNED: 13
    SKELETON: 12
    STRAY: 14
    SPIDER: 10
    CAVE_SPIDER: 11
    CREEPER: 18
    ENDERMAN: 40
    WITCH: 45
    PIGLIN: 20
    PIGLIN_BRUTE: 55
    HOGLIN: 30
    BLAZE: 35
    WITHER_SKELETON: 50
    GHAST: 45
    SLIME: 8
    MAGMA_CUBE: 12
    PHANTOM: 22
    PILLAGER: 24
    VINDICATOR: 32
    RAVAGER: 70
    EVOKER: 75
    GUARDIAN: 38
    ELDER_GUARDIAN: 120
    SHULKER: 42
    WARDEN: 400
    ENDER_DRAGON: 1500
    WITHER: 1200

party:
  # Maximum size including the leader.
  max-size: 5

  # Range in blocks, measured from the DEAD CREATURE - the one point every member has in common.
  # Measuring from a contributor instead could be stretched into a chain of players and would be
  # ambiguous when several members dealt damage. A different world is never in range.
  range-blocks: 50.0

  # Percentage added per ADDITIONAL member in range. Not a fixed amount: a fixed bonus would be
  # enormous at level 1 and irrelevant at level 60, because mob experience rises steeply. This is
  # the opposite case from environmental damage in B05, where a fixed amount is exactly the point.
  #
  # One member in range means no bonus at all - a party of one behaves like no party.
  bonus-per-member: 0.10

  # Ceiling for the bonus overall. Must not be below bonus-per-member: that would cap the bonus at
  # the second member and make bonus-per-member meaningless, so the start refuses it.
  bonus-cap: 0.40

  # An invitation expires after this. Checked when something asks, never by a scheduled task.
  invite-timeout-seconds: 60

progress-event:
  # Experience gains inside this window are summed into ONE event - the same pattern combat.yml
  # uses for damage numbers. At 1000 gains per second, one event per gain would be thousands of
  # draw calls per second for B13.
  #
  # A level-up flushes the open window first, so the progress bar never jumps backwards.
  window-millis: 500
