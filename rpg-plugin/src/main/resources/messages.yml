# Player-facing texts. Constitution V: no text lives in code.
#
# Every key used anywhere in the plugin must appear here - the bootstrap validates that and
# refuses to start otherwise (FR-023a), so a forgotten entry cannot surface later as a blank
# message at the worst possible moment.
#
# Placeholders are written as {name} and substituted in a single pass; substituted content is
# never re-examined, so a value containing {something} cannot inject another placeholder.
#
# Multilingual support is NOT implemented (ADR-005) - this file is the structure that keeps it
# possible without touching code later.

server:
  kick:
    # Shown while the plugin is still starting up (B01, FR-013)
    starting-up: 'The server is still starting up. Please try again in a moment.'
    # Shown when the bootstrap failed and the server refuses sessions
    bootstrap-failed: 'The server did not start correctly and is not accepting players. Please contact an administrator.'
    # Shown while the server is shutting down
    shutting-down: 'The server is shutting down.'

session:
  kick:
    # Stored state could not be read; the login is refused (B03, FR-011)
    load-failed: 'Your character data could not be loaded. Your progress is safe - please try again shortly.'
    # Loading exceeded its 5 second budget (B03, FR-006)
    load-timeout: 'Loading your character took too long. Please try again.'
    # The stored state is in a version this build does not know (B03, FR-027)
    unknown-data-version: 'Your character data was saved by a newer version of the server. Please contact an administrator.'
  character:
    # A second character of the same class was rejected (B03, FR-020)
    class-taken: 'You already have a character of that class.'

persistence:
  kick:
    # Shown when persistence is unreachable and no state can be loaded (B02, FR-005a)
    database-unavailable: 'The server cannot reach its data storage right now. Your progress is safe - please try again shortly.'
    # Shown when the write buffer hit its limit and everyone must be disconnected (B02, FR-009b)
    buffer-exhausted: 'The server must disconnect you to protect your progress. Please try again shortly.'

progression:
  # B06. Every player-facing string of the progression block lives here; the block itself contains
  # no text at all (FR-038). B13 draws these and B14 answers with them.
  level-up: 'You reached level <level>.'
  max-level: 'You have reached the maximum level.'
  party:
    created: 'You founded a party.'
    invited: 'You invited <player> to your party.'
    joined: '<player> joined the party.'
    left: '<player> left the party.'
    removed: '<player> was removed from the party.'
    disbanded: 'The party was disbanded.'
    leader-changed: '<player> is now the party leader.'
    error:
      already-in-party: 'That player is already in a party.'
      full: 'Your party is full.'
      not-leader: 'Only the party leader can do that.'
      invite-expired: 'That invitation has expired.'
      invite-unknown: 'You have no pending invitation.'
      target-not-ready: 'That player is not ready yet.'
      self-invite: 'You cannot invite yourself.'
      not-a-member: 'That player is not in your party.'

combat:
  status:
    # The player's own health and defence, on the action bar. Redrawn on every change and once a
    # second while in combat, because Minecraft fades an action bar after about two seconds.
    # A player: health, mana, defence. The colour of the whole line follows health alone - it is the
    # number that decides whether to run.
    action-bar: '{health}/{max} HP ({percent}%)   {mana}/{maxMana} MP   DEF {defense}'
    # A mob has no mana. Its own text rather than a placeholder that stays empty: 0/0 would take
    # space from three numbers that mean something.
    action-bar-no-mana: '{health}/{max} HP ({percent}%)   DEF {defense}'
    # Ein Spieler mit Zaehler - heute nur der Berserker. Eigener Text statt eines Platzhalters,
    # der bei Magier und Rogue leer bliebe: drei Zahlen, die etwas sagen, sollen ihren Platz
    # nicht an eine vierte verlieren, die nichts sagt.
    action-bar-with-meter: '{health}/{max} HP ({percent}%)   {mana}/{maxMana} MP   DEF {defense}   RAGE {meter}'
  mob:
    # Über jeder Kreatur. EINE Zeile - vanilla gibt einer Entität genau einen Namen, und eine
    # Lebensleiste DARUNTER wäre eine zweite Entität je Mob (ADR-005, Prinzip II).
    nameplate: "{name}  {health}/{max}  DEF {defense}"

class:
  # Display names. The enum constant stays WARRIOR; "Berserker" is a value here, never in code
  # (ADR-019). This is also where a later translation would land without touching a class file.
  warrior:
    name: 'Berserker'
  mage:
    name: 'Mage'
  rogue:
    name: 'Rogue'

  selection:
    title: 'Choose your class'
    chosen: 'You are now a {class}.'
    # Shown when a player tries to leave the selection. Before the choice there is no game state
    # at all (ADR-020), so there is nothing to go back to.
    locked: 'Choose a class first.'
    error:
      class-taken: 'You already have a {class} on this account.'
      unknown-class: 'That class does not exist.'
      already-has-character: 'You already have a character in play.'
    # The selection is shown on every join, so it cannot be waited out: a player parked in the menu
    # holds a session and a server slot without ever entering the world.
    timeout:
      warning: 'Choose a character within {seconds} seconds or you will be disconnected.'
      kick: 'Disconnected: no character was chosen.'

  # Lore of one slot in the selection. Shown on every join, so it has to answer "which of my
  # characters is this" at a glance.
  slot:
    level: 'Level {level}'
    tiers: 'Armour {armor}/{armor_max}   Weapon {weapon}/{weapon_max}'
    last-played: 'Last played {when} ago'
    resume: 'Click to play'
    empty: 'No character yet'
    create: 'Click to create one'

  tier:
    advanced: 'Your {slot} advanced to tier {tier}.'
    error:
      below-required-level: 'That tier requires level {level}.'
      already-at-top: 'That is already the highest tier.'
      unknown-character: 'No character found.'

  equipment:
    # The class armour and weapon are part of the character, not contents of its inventory
    # (ADR-018).
    bound: 'That is part of your character and cannot be moved.'
    drop-disabled: 'Items cannot be thrown. Use your ender chest, a vendor, or the bin.'

  inventory:
    # No automatic cleanup, no background bank, no silent discard - the player makes room.
    full: 'Your inventory is full. Make room before more loot arrives.'

# B08 - abilities. Every one of these is referenced by AbilityMessageKeys; the display names of the
# eighteen abilities themselves come from abilities.yml, which names a key rather than a text.
ability:
  rejected:
    on-cooldown: 'That ability is still on cooldown for {seconds}s.'
    global-lock: 'Too soon after your last ability.'
    not-enough-mana: 'Not enough mana - {cost} needed.'
    not-unlocked: 'You unlock that ability at level {level}.'
    already-casting: 'You are already casting something.'
    already-sustaining: 'Finish {ability} first.'
    no-charges: 'No charges left.'
    no-character: 'Choose a class first.'

  # A passive marker was clicked. Deliberately NOT under "rejected": the player owns the ability,
  # nothing was refused, and saying so is the whole reason the marker occupies a hotbar slot.
  passive: 'That ability is passive - it works on its own, no click needed.'

  unlocked: 'New ability unlocked: {ability}.'

  rank:
    advanced: '{ability} is now rank {rank}.'
    at-maximum: '{ability} is already at its highest rank.'
    # Since B08b (ADR-027): a rank has a price. Checked last, after unlock and maximum rank, so
    # seeing this means everything else was in order.
    not-enough-coins: 'Not enough coins to raise that rank.'

  toggle:
    changed: '{ability} is now {state}.'

  second-life:
    # No respawn and no death screen - the rogue is put back where he fell (FR-052c).
    title: 'Second Life'
    subtitle: 'Death passed you by.'

  # The display names of the eighteen. abilities.yml names a key, never a text - so a rename here
  # never touches balancing, and a translation never touches numbers (Principle V).
  warrior:
    rage:
      name: 'Rage'
      description: 'Grows with every blow you land or take. Fades when the fighting stops.'
    shield:
      name: 'Block'
      description: 'Absorbs physical damage for a while. Magic goes straight through.'
    leap:
      name: 'Leap'
      description: 'A long jump to where you are looking. Everything at the landing takes it.'
    lifesteal:
      name: 'Lifesteal'
      description: 'A share of the damage you deal comes back as health.'
    whirl:
      name: 'Whirl'
      description: 'Physical damage to everything around you, once a second.'
    call-of-the-berserker:
      name: 'War Cry'
      description: 'Move and strike faster for a while. Endable early.'

  rogue:
    poisoned-blade:
      name: 'Poisoned Blade'
      description: 'A chance to poison what you hit. Stacks up to three times.'
    teleport:
      name: 'Teleport'
      description: 'Step instantly to the mob you are looking at. Two charges.'
    backstab:
      name: 'Sneaky Backstab'
      description: 'Hitting from behind makes you faster and stronger for a minute.'
    invisibility:
      name: 'Vanish'
      description: 'Unseen and untouchable, until you strike or step out of it.'
    clone:
      name: 'Clone'
      description: 'A double of you that does not fight, and goes off when it ends.'
    second-life:
      name: 'Second Life'
      description: 'A chance to be put back on your feet instead of dying.'

  mage:
    magic-life:
      name: 'Magic Life'
      description: 'Softens every blow and arrow that reaches you. Cast damage comes through in full.'
    lightning:
      name: 'Lightning'
      description: 'Strikes your target and jumps on to the next, up to eight.'
    magic-shield:
      name: 'Magic Shield'
      description: 'Absorbs damage of any kind for a while.'
    mana-potion:
      name: 'Mana Potion'
      description: 'Mana every second. Any damage taken ends it.'
    lightning-storm:
      name: 'Lightning Storm'
      description: 'A storm on the ground where you point. It stays where you called it.'
    rise-and-fall:
      name: 'Rise & Fall'
      description: 'A second jump in mid-air, then a slow fall. Switchable.'

# B08b - currency and account.
currency:
  rejected:
    not-enough: 'Not enough coins - {needed} needed, you have {balance}.'
    invalid-amount: 'That is not a valid amount of coins.'
    overflow: 'That would exceed the largest balance the server can hold.'
    no-character: 'No such character.'
  pile:
    picked-up: 'Picked up {amount} coins.'
    # The cap bit and an older pile was credited instead of dropped (FR-030a). Deliberately not
    # worded as a pickup: the player did not pick anything up.
    cashed-in: '{amount} coins from an earlier pile were added to your balance.'
  starting-balance: 'You start with {amount} coins.'
  balance:
    current: '{character}: {amount} coins.'
  admin:
    applied: '{character} now has {amount} coins.'
    denied: 'You are not allowed to do that.'
    unknown-character: 'No such character for that player.'
  # The window is provisional (ADR-028); B13 will own this wording.
  menu:
    title-characters: 'Coins'
    title-history: 'Coins - {character}'
    character-entry: '{character} - {amount} coins'
    history-entry: '{direction}{amount} - {reason}'
    page-next: 'Next page'
    page-previous: 'Previous page'
    empty: 'No bookings yet.'
