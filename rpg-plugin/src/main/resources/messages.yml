# Player-facing texts. Constitution V: no text lives in code.
#
# Every key used anywhere in the plugin must appear here - the bootstrap validates that and
# refuses to start otherwise (FR-023a), so a forgotten entry cannot surface later as a blank
# message at the worst possible moment.
#
# Placeholders are written as {name} and substituted in a single pass; substituted content is
# never re-examined, so a value containing {something} cannot inject another placeholder.
#
# Multilingual support is NOT implemented (ADR-005) - this file is the structure that keeps it
# possible without touching code later.

server:
  kick:
    # Shown while the plugin is still starting up (B01, FR-013)
    starting-up: 'The server is still starting up. Please try again in a moment.'
    # Shown when the bootstrap failed and the server refuses sessions
    bootstrap-failed: 'The server did not start correctly and is not accepting players. Please contact an administrator.'
    # Shown while the server is shutting down
    shutting-down: 'The server is shutting down.'

session:
  kick:
    # Stored state could not be read; the login is refused (B03, FR-011)
    load-failed: 'Your character data could not be loaded. Your progress is safe - please try again shortly.'
    # Loading exceeded its 5 second budget (B03, FR-006)
    load-timeout: 'Loading your character took too long. Please try again.'
    # The stored state is in a version this build does not know (B03, FR-027)
    unknown-data-version: 'Your character data was saved by a newer version of the server. Please contact an administrator.'
  character:
    # A second character of the same class was rejected (B03, FR-020)
    class-taken: 'You already have a character of that class.'

persistence:
  kick:
    # Shown when persistence is unreachable and no state can be loaded (B02, FR-005a)
    database-unavailable: 'The server cannot reach its data storage right now. Your progress is safe - please try again shortly.'
    # Shown when the write buffer hit its limit and everyone must be disconnected (B02, FR-009b)
    buffer-exhausted: 'The server must disconnect you to protect your progress. Please try again shortly.'

progression:
  # B06. Every player-facing string of the progression block lives here; the block itself contains
  # no text at all (FR-038). B13 draws these and B14 answers with them.
  level-up: 'You reached level <level>.'
  max-level: 'You have reached the maximum level.'
  party:
    created: 'You founded a party.'
    invited: 'You invited <player> to your party.'
    joined: '<player> joined the party.'
    left: '<player> left the party.'
    removed: '<player> was removed from the party.'
    disbanded: 'The party was disbanded.'
    leader-changed: '<player> is now the party leader.'
    error:
      already-in-party: 'That player is already in a party.'
      full: 'Your party is full.'
      not-leader: 'Only the party leader can do that.'
      invite-expired: 'That invitation has expired.'
      invite-unknown: 'You have no pending invitation.'
      target-not-ready: 'That player is not ready yet.'
      self-invite: 'You cannot invite yourself.'
      not-a-member: 'That player is not in your party.'

class:
  # Display names. The enum constant stays WARRIOR; "Berserker" is a value here, never in code
  # (ADR-019). This is also where a later translation would land without touching a class file.
  warrior:
    name: 'Berserker'
  mage:
    name: 'Mage'
  rogue:
    name: 'Rogue'

  selection:
    title: 'Choose your class'
    chosen: 'You are now a {class}.'
    # Shown when a player tries to leave the selection. Before the choice there is no game state
    # at all (ADR-020), so there is nothing to go back to.
    locked: 'Choose a class first.'
    error:
      class-taken: 'You already have a {class} on this account.'
      unknown-class: 'That class does not exist.'
      already-has-character: 'You already have a character in play.'

  tier:
    advanced: 'Your {slot} advanced to tier {tier}.'
    error:
      below-required-level: 'That tier requires level {level}.'
      already-at-top: 'That is already the highest tier.'
      unknown-character: 'No character found.'

  equipment:
    # The class armour and weapon are part of the character, not contents of its inventory
    # (ADR-018).
    bound: 'That is part of your character and cannot be moved.'
    drop-disabled: 'Items cannot be thrown. Use your ender chest, a vendor, or the bin.'

  inventory:
    # No automatic cleanup, no background bank, no silent discard - the player makes room.
    full: 'Your inventory is full. Make room before more loot arrives.'
