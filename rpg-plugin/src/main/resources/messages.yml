class:
  # Display names. The enum constant stays WARRIOR; "Berserker" is a value here, never in code
  # (ADR-019). This is also where a later translation would land without touching a class file.
  warrior:
    name: 'Berserker'
  mage:
    name: 'Mage'
  rogue:
    name: 'Rogue'

  selection:
    title: 'Choose your class'
    chosen: 'You are now a {class}.'
    # Shown when a player tries to leave the selection. Before the choice there is no game state
    # at all (ADR-020), so there is nothing to go back to.
    locked: 'Choose a class first.'
    # Der Betreiber-Zugang. Nur sichtbar mit rpg.admin.no-class, und er waehlt keine Klasse: kein
    # Charakter, keine Werte, keine Ausruestung - dafuer Creative, damit Moderieren ueberhaupt geht.
    admin-entry: 'Enter without a class (operator)'
    admin-entered: 'You entered without a class. No character, no stats - Creative.'
    error:
      class-taken: 'You already have a {class} on this account.'
      unknown-class: 'That class does not exist.'
      already-has-character: 'You already have a character in play.'
    # The selection is shown on every join, so it cannot be waited out: a player parked in the menu
    # holds a session and a server slot without ever entering the world.
    timeout:
      warning: 'Choose a character within {seconds} seconds or you will be disconnected.'
      kick: 'Disconnected: no character was chosen.'

  # Lore of one slot in the selection. Shown on every join, so it has to answer "which of my
  # characters is this" at a glance.
  slot:
    level: 'Level {level}'
    tiers: 'Armour {armor}/{armor_max}   Weapon {weapon}/{weapon_max}'
    last-played: 'Last played {when} ago'
    resume: 'Click to play'
    empty: 'No character yet'
    create: 'Click to create one'

  tier:
    advanced: 'Your {slot} advanced to tier {tier}.'
    error:
      below-required-level: 'That tier requires level {level}.'
      already-at-top: 'That is already the highest tier.'
      unknown-character: 'No character found.'

  equipment:
    # The class armour and weapon are part of the character, not contents of its inventory
    # (ADR-018).
    bound: 'That is part of your character and cannot be moved.'
    drop-disabled: 'Items cannot be thrown. Use your ender chest, a vendor, or the bin.'

  inventory:
    # No automatic cleanup, no background bank, no silent discard - the player makes room.
    full: 'Your inventory is full. Make room before more loot arrives.'

# B08 - abilities. Every one of these is referenced by AbilityMessageKeys; the display names of the
# eighteen abilities themselves come from abilities.yml, which names a key rather than a text.
ability:
  rejected:
    on-cooldown: 'That ability is still on cooldown for {seconds}s.'
    global-lock: 'Too soon after your last ability.'
    not-enough-mana: 'Not enough mana - {cost} needed.'
    not-unlocked: 'You unlock that ability at level {level}.'
    already-casting: 'You are already casting something.'
    already-sustaining: 'Finish {ability} first.'
    no-charges: 'No charges left.'
    no-character: 'Choose a class first.'

  # A passive marker was clicked. Deliberately NOT under "rejected": the player owns the ability,
  # nothing was refused, and saying so is the whole reason the marker occupies a hotbar slot.
  passive: 'That ability is passive - it works on its own, no click needed.'

  unlocked: 'New ability unlocked: {ability}.'

  # Said whenever a passive really took something off an incoming hit. A mitigation is invisible by
  # nature - it makes a number smaller, and a smaller number among other numbers looks like nothing,
  # which is why Magic Life was reported as broken while working.
  mitigated: 'Absorbed {absorbed} damage ({left} got through).'

  rank:
    advanced: '{ability} is now rank {rank}.'
    at-maximum: '{ability} is already at its highest rank.'
    # Since B08b (ADR-027): a rank has a price. Checked last, after unlock and maximum rank, so
    # seeing this means everything else was in order.
    not-enough-coins: 'Not enough coins to raise that rank.'

  toggle:
    changed: '{ability} is now {state}.'

  second-life:
    # No respawn and no death screen - the rogue is put back where he fell (FR-052c).
    title: 'Second Life'
    subtitle: 'Death passed you by.'

  # The display names of the eighteen. abilities.yml names a key, never a text - so a rename here
  # never touches balancing, and a translation never touches numbers (Principle V).
  warrior:
    rage:
      name: 'Rage'
      description: 'Grows with every blow you land or take. Fades when the fighting stops.'
    shield:
      name: 'Block'
      description: 'Absorbs physical damage for a while. Magic goes straight through.'
    leap:
      name: 'Leap'
      description: 'A long jump to where you are looking. Everything at the landing takes it.'
    lifesteal:
      name: 'Lifesteal'
      description: 'A share of the damage you deal comes back as health.'
    whirl:
      name: 'Whirl'
      description: 'Physical damage to everything around you, once a second.'
    call-of-the-berserker:
      name: 'War Cry'
      description: 'Move and strike faster for a while. Endable early.'

  rogue:
    poisoned-blade:
      name: 'Poisoned Blade'
      description: 'A chance to poison what you hit. Stacks up to three times.'
    teleport:
      name: 'Teleport'
      description: 'Step instantly to the mob you are looking at. Two charges.'
    backstab:
      name: 'Sneaky Backstab'
      description: 'Hitting from behind makes you faster and stronger for a minute.'
    invisibility:
      name: 'Vanish'
      description: 'Unseen and untouchable, until you strike or step out of it.'
    clone:
      name: 'Clone'
      description: 'A double of you that does not fight, and goes off when it ends.'
    second-life:
      name: 'Second Life'
      description: 'A chance to be put back on your feet instead of dying.'

  mage:
    magic-life:
      name: 'Magic Life'
      description: 'Softens every blow and arrow that reaches you. Cast damage comes through in full.'
    lightning:
      name: 'Lightning'
      description: 'Strikes your target and jumps on to the next, up to eight.'
    magic-shield:
      name: 'Magic Shield'
      description: 'Absorbs damage of any kind for a while.'
    mana-potion:
      name: 'Mana Potion'
      description: 'Mana every second. Any damage taken ends it.'
    lightning-storm:
      name: 'Lightning Storm'
      description: 'A storm on the ground where you point. It stays where you called it.'
    rise-and-fall:
      name: 'Rise & Fall'
      description: 'A second jump in mid-air, then a slow fall. Switchable.'

# B08b - currency and account.
currency:
  rejected:
    not-enough: 'Not enough coins - {needed} needed, you have {balance}.'
    invalid-amount: 'That is not a valid amount of coins.'
    overflow: 'That would exceed the largest balance the server can hold.'
    no-character: 'No such character.'
  pile:
    picked-up: 'Picked up {amount} coins.'
    # The cap bit and an older pile was credited instead of dropped (FR-030a). Deliberately not
    # worded as a pickup: the player did not pick anything up.
    cashed-in: '{amount} coins from an earlier pile were added to your balance.'
  starting-balance: 'You start with {amount} coins.'
  balance:
    current: '{character}: {amount} coins.'
  admin:
    applied: '{character} now has {amount} coins.'
    denied: 'You are not allowed to do that.'
    unknown-character: 'No such character for that player.'
  # The window is provisional (ADR-028); B13 will own this wording.
  menu:
    title-characters: 'Coins'
    title-history: 'Coins - {character}'
    character-entry: '{character} - {amount} coins'
    history-entry: '{direction}{amount} - {reason}'
    page-next: 'Next page'
    page-previous: 'Previous page'
    empty: 'No bookings yet.'

# B09 - zones and regions.
#
# Zone names are keys here and NOWHERE else: `zones.yml` carries the technical key, this file
# carries what the player reads (FR-003a). Renaming a region is one line here, and no portal,
# spawn area or later block has to be touched for it (SC-017).
#
# A missing key refuses the start (FR-003c). A zone whose name shows up in game as a key string
# is a mistake that should surface at start, not in front of a player.
zone:
  greenfields:
    name: 'The Greenfields'
  dustlands:
    name: 'The Dustlands'
  safari-plains:
    name: 'The Safari Plains'
  terracotta-canyons:
    name: 'The Terracotta Canyons'
  darkforest:
    name: 'The Darkforest'
  pale-wilds:
    name: 'The Pale Wilds'

  # Entering a region below its level band (FR-021). Warns once, never blocks (FR-022, FR-024).
  too-dangerous: 'This area is too dangerous for you. Recommended level: {min}-{max}.'
  # Death (FR-035). Costs no experience and no items (FR-036).
  died: 'You died.'
  # First login after a combat logout (ADR-030, FR-041)
  died-logout: 'You logged out in combat and died.'

  # Waypoint crystals. Input and window are temporary here and belong to B13 (ADR-032).
  waypoint:
    menu-title: 'Waypoints'
    unlocked: 'Waypoint discovered: {zone}.'
    locked: 'You have not discovered {zone} yet.'
    not-enough-coins: 'Travelling to {zone} costs {price} coins - you do not have enough.'
    in-combat: 'You cannot travel while in combat.'
    gone: 'That waypoint no longer exists.'
    travelled: 'You travelled to {zone} for {price} coins.'
    # Shown when the teleport failed after the debit went through and the coins came back
    # (FR-050f, research.md R1). A journey never ends at a loss.
    refunded: 'The journey failed. Your {price} coins were returned.'
    # Shown in the window on a locked entry (FR-048a)
    entry-unlocked: '{zone} - level {band-min}-{band-max} ({price} coins)'
    entry-locked: '{zone} - level {band-min}-{band-max} (not discovered)'
    entry-here: '{zone} - you are here'

# ---------------------------------------------------------------------------------------------
# B11 - Items, Ausrüstung & Loot.
#
# Der Name einer Vorlage ist ein SCHLÜSSEL, kein Text. Er lebt hier und nirgends sonst; eine
# Vorlage umzubenennen ist eine Zeile in dieser Datei, und keine Beutetabelle und kein
# Händlerbestand muss dafür angefasst werden (Prinzip V). ItemModule.start weist den Start ab,
# wenn eine konfigurierte Vorlage hier keinen Namen hat - ein Trank, der als
# item.potion.minor-healing.name durchs Inventar liefe, ist kein Zustand, den man bemerkt.
#
# Die Wirkungswerte stehen NICHT hier. Sie kommen aus items.yml und werden bei jedem Laden neu
# abgeleitet (FR-002) - stünden sie hier, wäre ein Balancing zwei Dateien statt einer, und die
# zweite würde vergessen.
# ---------------------------------------------------------------------------------------------
item:
  # Die acht Raritätsstufen. Ein Etikett, sonst nichts: ein epischer Trank heilt nicht mehr als
  # ein gewöhnlicher, er ist seltener (FR-014, ADR-027).
  rarity:
    common: { name: 'Common' }
    uncommon: { name: 'Uncommon' }
    rare: { name: 'Rare' }
    epic: { name: 'Epic' }
    legendary: { name: 'Legendary' }
    mythic: { name: 'Mythic' }
    divine: { name: 'Divine' }
    special: { name: 'Special' }

  # Die fünf Ablehnungen (FR-037). Jede hat ihre eigene Meldung: "geht nicht" ist keine Antwort,
  # und ein Spieler, der den Grund nicht erfährt, hält den Trank für kaputt.
  refused:
    level: '&cYou are not high enough level for that.'
    class: '&cThat is not for your class.'
    cooldown: '&c{seconds} seconds to go.'
    no-effect: '&7That would do nothing right now.'
    unknown: '&7There is nothing you can do with that.'

  # Der Händler (FR-057 bis FR-065). Das Fenster zeichnet Vanilla-Materialien und holt jede
  # sichtbare Zeile von hier - B13 tauscht später die Darstellung, ohne dass ein Schlüssel sich
  # ändert. Jede Ablehnung nennt ihren Grund, aus demselben Grund wie oben bei den Tränken.
  vendor:
    title: 'Merchant'
    sell: '&eSell'
    # Je Leiter einer. B07 kennt genau zwei, und sie verschleißen getrennt - ein gemeinsamer Knopf
    # müsste raten, welche gemeint ist.
    repair:
      armor-ladder: '&eRepair armour'
      weapon-ladder: '&eRepair weapon'
    upgrade:
      armor-ladder: '&eUpgrade armour'
      weapon-ladder: '&eUpgrade weapon'
    price: '&6{price} coins'
    price-short: '&c{price} coins'
    sold: '&aSold for {amount} coins.'
    bought: '&aBought for {amount} coins.'
    not-sellable: '&cHe will not take that.'
    bound: '&cYour class equipment stays with you.'
    not-in-stock: '&cHe does not carry that here.'
    not-enough: '&cYou do not have that many coins.'
    no-room: '&cThere is no room in your inventory.'

  # Verschleiß und Reparatur (FR-051 bis FR-056). Die Warnung kommt höchstens einmal je Schwelle
  # und Ruhezeit - eine Meldung bei jedem Treffer wäre eine, die niemand mehr liest, und dann fiele
  # die eine, auf die es ankam, auch nicht mehr auf.
  repair:
    done: '&aRepaired for {price} coins.'
    not-worn: '&7There is nothing to repair there.'
    route-locked: '&cYour class equipment can only be repaired by the merchant.'

  wear:
    warning: '&eYour gear is worn ({condition}%). Have it repaired before it costs you a fight.'

  potion:
    minor-healing:
      name: 'Minor Healing Potion'
      lore: 'A thin red brew. Enough to finish a fight you nearly lost.'
    healing:
      name: 'Healing Potion'
      lore: 'Brewed for people who expect to be hit.'
    greater-healing:
      name: 'Greater Healing Potion'
      lore: 'The last one you drink before deciding to run.'
    lesser-mana:
      name: 'Lesser Mana Potion'
      lore: 'Bitter. Works anyway.'
    mana:
      name: 'Mana Potion'
      lore: 'Steadier than the lesser sort, and twice the price.'
    stoneskin:
      name: 'Stoneskin Draught'
      lore: 'Your skin remembers being rock. Briefly.'
    fury:
      name: 'Draught of Fury'
      lore: 'Faster, harder, and no help at all when it wears off.'

  trim:
    ember:
      name: 'Ember Trim'
      lore: 'Worn by those who have nothing left to prove.'
    frost:
      name: 'Frost Trim'
      lore: 'Cold enough to be noticed across a battlefield.'
    verdant:
      name: 'Verdant Trim'
      lore: 'The rarest of the three, and the hardest to explain.'
