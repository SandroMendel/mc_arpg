name: VuntexRPG
version: '${version}'
main: rpg.plugin.RpgPlugin
api-version: '26.2'
description: 'B01 Core & Platform, B02 Persistence, B03 Player Session - module registry, event bus, scheduler abstraction, configuration, PostgreSQL persistence and the player session lifecycle.'
author: Vuntex
website: https://github.com/vuntex/vuntex-rpg

# POSTWORLD, und das ist keine Formalie: der Start haengt daran.
#
# Hier stand STARTUP, seit dem ersten Commit, als dieses Plugin nur B01 bis B03 war und keine Welt
# brauchte. STARTUP heisst: onEnable laeuft, BEVOR Paper die Welten laedt - getWorlds() ist dann leer
# und Bukkit.getWorld("world") gibt null. B09 hat mit zones.yml eine harte Abhaengigkeit davon
# eingefuehrt: WorldResolver loest jeden `world:`-Namen beim Binden der Konfiguration auf und
# verweigert den Start bei einer unbekannten Welt (FR-002a). Unter STARTUP ist JEDE Welt unbekannt,
# also verweigerte der Zonenblock den Start immer - mit einer Meldung, die auf die Konfiguration
# zeigte, waehrend der Fehler in dieser Zeile stand.
#
# Warum es kein Test gefunden hat: FullBootstrapTest legt die Welt an, BEVOR es das Plugin laedt -
# ausdruecklich, weil B04s Regenerationssperre eine geladene Welt braucht. Genau diese Reihenfolge
# gibt es auf dem echten Server unter STARTUP nicht. Die Ladeordnung stand in keinem Test, weil sie
# in keinem Test vorkam. PluginDescriptorTest prueft sie jetzt.
#
# Zwei Stellen werden davon still mitgeheilt, die unter STARTUP nie etwas taten: die Schleife, die
# schon geladene Kreaturen ausstattet, und die Regelsetzung auf schon geladene Welten. Beide
# iterierten ueber eine leere Liste.
load: POSTWORLD

# Resolved by Paper from Maven Central at startup into an isolated classloader (ADR-010).
# Keeping them out of the jar preserves the property established in B01 that the shipped
# artifact contains no third-party classes.
libraries:
  - org.postgresql:postgresql:42.7.13
  - com.zaxxer:HikariCP:7.1.0
  - org.flywaydb:flyway-core:13.3.0
  - org.flywaydb:flyway-database-postgresql:13.3.0

# The first commands block in this project (ADR-028). Commands belong to B14 - layer 3, and it
# depends on every other block, which makes it the last one, not the next. B08b needs an operator
# to be able to correct a balance now, and an interface with no way to call it is present and
# unusable. B14 replaces the shell and leaves the interface standing (FR-046).
commands:
  # B13. VORLAEUFIG wie /coins, /stats und /top: Rechtebaum, Tab-Completion und die
  # einheitliche Kommandostruktur bleiben B14 (FR-058). Dieser Block legt genau EINEN
  # Eintrag an - den, den sein eigenes Fenster braucht - und sammelt keine fremden ein.
  #
  # Kein Argument: die Uebersicht zeigt den AKTIVEN Charakter, und eine Summe ueber
  # mehrere bildet sie nicht (FR-053). Ein Argument waere die Einladung, genau das zu
  # erwarten.
  char:
    description: 'Open your character sheet.'
    usage: '/char'
    permission: rpg.ui.character
  coins:
    description: 'Open the coin window, or change a balance.'
    usage: '/coins | /coins <player> | /coins set|add|remove <player> <class> <amount>'
    permission: rpg.currency.balance
  trash:
    description: "Destroy the item in your hand for good, after a confirmation."
    usage: "/trash (again to confirm)"
    permission: rpg.item.trash
  xp:
    description: 'Give experience, take it away, or set a level.'
    usage: '/xp give|take <player> <amount> | /xp set <player> <level> [xp]'
    permission: rpg.progression.admin
  top:
    description: 'Open a leaderboard.'
    usage: '/top [board] [period]'
    permission: rpg.statistics.top
  stats:
    description: 'Open your own record.'
    usage: '/stats [period]'
    permission: rpg.statistics.own

permissions:
  rpg.statistics.own:
    description: 'Open your own record.'
    # Fuer alle: die eigenen Zahlen anzusehen ist kein administrativer Akt.
    default: true
  rpg.statistics.top:
    description: 'Open a leaderboard.'
    # Fuer alle: eine Rangliste ist zum Ansehen da, und ein Recht, das erst vergeben werden muss,
    # waere eine stumme Funktion auf jedem frisch aufgesetzten Server.
    default: true
  rpg.ui.character:
    description: 'Open your own character sheet.'
    # Fuer jeden: die eigenen Werte anzusehen ist nichts, wofuer ein Betreiber erst
    # etwas freischalten sollte - dieselbe Ueberlegung wie bei rpg.currency.balance.
    default: true
  rpg.currency.balance:
    description: 'Open your own coin window.'
    # For everyone: seeing your own balance is not an administrative act.
    default: true
  rpg.currency.admin:
    description: "Open another player's window, and change a balance."
    default: op
  rpg.item.trash:
    description: "Destroy an item you are holding. Class equipment is refused."
    # Fuer alle: ADR-018 schaltet das Fallenlassen ab, also ist das der einzige Weg, etwas
    # Unverkaeufliches loszuwerden. Es einzuschraenken hiesse, ein volles Inventar zur Sackgasse
    # zu machen.
    default: true
  rpg.progression.admin:
    description: "Change a character's experience or level. Every change is audited."
    default: op
  rpg.admin.no-class:
    description: 'Enter the world without choosing a class, in Creative. For moderating.'
    # Not for everyone, obviously - it is a way into the world that plays no character at all.
    default: op
