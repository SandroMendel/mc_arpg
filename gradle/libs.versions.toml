[versions]
# Platform (ADR-001: Java 25 / Paper on Minecraft 26.2)
java = "25"
paper = "26.2.build.112-stable"

# Libraries
snakeyaml = "2.6"
postgresql = "42.7.13"
hikaricp = "7.1.0"
flyway = "13.3.0"
testcontainers = "1.21.4"

# Compile-time only (annotation processors) - no runtime footprint, see build.gradle.kts
lombok = "1.18.46"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"

# Test
junit = "6.1.3"
assertj = "3.27.7"
mockbukkit = "4.116.1"

# Build plugins
spotless = "8.10.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
